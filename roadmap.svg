<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" role="img" aria-label="Data analytics portfolio roadmap">
  <defs>
    <style>
      .title { font: 700 26px system-ui, -apple-system, sans-serif; fill: #1a2332; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #5b6b82; }
      .week { font: 700 14px system-ui, -apple-system, sans-serif; fill: #b07d1e; letter-spacing: 1.5px; }
      .card-title { font: 700 18px system-ui, -apple-system, sans-serif; fill: #1a2332; }
      .card-sub { font: 400 14px system-ui, -apple-system, sans-serif; fill: #5b6b82; }
      .card-skill { font: 600 12.5px system-ui, -apple-system, sans-serif; fill: #2e6f4e; }
      .end { font: 700 17px system-ui, -apple-system, sans-serif; fill: #1a2332; }
      .end-sub { font: 400 14px system-ui, -apple-system, sans-serif; fill: #5b6b82; }
    </style>
  </defs>

  <rect x="0" y="0" width="480" height="760" fill="#f7f4ec"/>

  <text x="24" y="48" class="title">Data Portfolio Roadmap</text>
  <text x="24" y="72" class="subtitle">3 projects · 1 per week · evenings only</text>

  <!-- vertical spine -->
  <line x1="48" y1="100" x2="48" y2="648" stroke="#d8c98f" stroke-width="3"/>

  <!-- Week 1 -->
  <circle cx="48" cy="150" r="14" fill="#1f3a5f"/>
  <text x="48" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="system-ui">1</text>
  <text x="72" y="128" class="week">WEEK 1</text>
  <rect x="72" y="136" width="384" height="128" rx="12" fill="#ffffff" stroke="#e3d9bd"/>
  <text x="92" y="164" class="card-title">SPC Process Monitoring</text>
  <text x="92" y="188" class="card-sub">"Is the line in control?" — X-bar &amp; R charts,</text>
  <text x="92" y="208" class="card-sub">out-of-control rules, Cp / Cpk capability.</text>
  <text x="92" y="236" class="card-skill">Python · pandas · SQL  ✓ starter scaffold ready</text>

  <!-- Week 2 -->
  <circle cx="48" cy="336" r="14" fill="#1f3a5f"/>
  <text x="48" y="342" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="system-ui">2</text>
  <text x="72" y="314" class="week">WEEK 2</text>
  <rect x="72" y="322" width="384" height="128" rx="12" fill="#ffffff" stroke="#e3d9bd"/>
  <text x="92" y="350" class="card-title">NCR Root-Cause Pareto</text>
  <text x="92" y="374" class="card-sub">"Where is the cost of poor quality?" — Pareto</text>
  <text x="92" y="394" class="card-sub">by defect mode &amp; supplier, action table.</text>
  <text x="92" y="422" class="card-skill">pandas · data storytelling</text>

  <!-- Week 3 -->
  <circle cx="48" cy="522" r="14" fill="#1f3a5f"/>
  <text x="48" y="528" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="system-ui">3</text>
  <text x="72" y="500" class="week">WEEK 3</text>
  <rect x="72" y="508" width="384" height="128" rx="12" fill="#ffffff" stroke="#e3d9bd"/>
  <text x="92" y="536" class="card-title">Supplier Quality Scorecard</text>
  <text x="92" y="560" class="card-sub">"Who earns more business?" — PPM, acceptance</text>
  <text x="92" y="580" class="card-sub">rate, on-time delivery, composite score.</text>
  <text x="92" y="608" class="card-skill">SQL · KPI design · Power BI / Tableau</text>

  <!-- End: GitHub -->
  <circle cx="48" cy="690" r="14" fill="#b07d1e"/>
  <text x="48" y="696" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="system-ui">★</text>
  <rect x="72" y="656" width="384" height="68" rx="12" fill="#1f3a5f"/>
  <text x="92" y="684" class="end" fill="#ffffff">Publish to GitHub</text>
  <text x="92" y="706" class="end-sub" fill="#d8c98f">Add the repo link to the data resume</text>
</svg>
